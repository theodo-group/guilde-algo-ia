name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run --locked --directory .github/project-index python -m project_index structure
      - run: uv run --locked --directory .github/project-index python -m project_index check
      - run: uv run --locked --directory .github/project-index pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix .github/project-index
      - run: uv run --locked --directory .github/project-index python -m project_index build --out "$RUNNER_TEMP/site"
      - run: node --test .github/project-index/tests/search.test.mjs
