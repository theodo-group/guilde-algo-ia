<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guilde Algo & IA — projets</title>
<link rel="icon" type="image/svg+xml" href="brand/theodo-icon.svg">
<style>
  :root {
    color-scheme: light dark;
    /* Theodo Master Brand: orange #ff512c, blue #294f73, navy #1d2939, grey #8f99aa, light blue #d1e2f2, light grey #e9ebef */
    --bg: #ffffff; --fg: #1d2939; --muted: #4f5d72; --line: #e9ebef; --card: #ffffff; --brand: #ff512c; --accent: #294f73; --chip: #d1e2f2; --chip-fg: #1d2939;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d2939; --fg: #e9ebef; --muted: #8f99aa; --line: #294f73; --card: #1d2939; --brand: #ff512c; --accent: #d1e2f2; --chip: #294f73; --chip-fg: #e9ebef; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; }
  header { border-top: 4px solid var(--brand); padding-top: 20px; }
  header .logo { display: block; height: 28px; margin-bottom: 16px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }
  #q { width: 100%; margin: 28px 0 8px; padding: 12px 14px; font: inherit; color: var(--fg);
       background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  #q:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
  #count { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 32px 0 8px; }
  h3 { font-size: 17px; margin: 16px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card a.title { color: var(--fg); font-weight: 600; text-decoration: none; }
  .card a.title:hover { color: var(--accent); text-decoration: underline; text-decoration-color: var(--brand); text-underline-offset: 3px; }
  .card p { margin: 4px 0 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .meta a { color: var(--accent); }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--chip-fg); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="brand/theodo-logo.svg" alt="Theodo">
    <h1>Guilde Algo &amp; IA</h1>
    <p>Les projets présentés en guilde, par thème et par sujet.
      <a href="https://app.notion.com/p/m33/Guilde-Algo-IA-1f1744af43ed4491948aa59646624eba">Page Notion de la guilde</a> ·
      <a href="https://github.com/theodo-group/guilde-algo-ia">Repo GitHub</a></p>
  </header>
  <input id="q" type="search" placeholder="Rechercher un sujet, une techno, un auteur…" autofocus>
  <div id="count"></div>
  <div id="list"></div>
</main>
<script type="module">
import { search } from "./search.js";

const REPO = "https://github.com/theodo-group/guilde-algo-ia/tree/main/";
const list = document.getElementById("list");
const count = document.getElementById("count");
const q = document.getElementById("q");
let projects = [];

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
function card(p, withPath) {
  const meta = el("div", { className: "meta" }, [
    ...(withPath ? [el("span", { textContent: `${p.theme} / ${p.sujet}` })] : []),
    el("span", { textContent: p.auteurs.join(", ") }),
    ...(p.date ? [el("span", { textContent: p.date })] : []),
    ...(p.session ? [el("a", { href: p.session, textContent: "Présentation" })] : []),
    ...p.stack.map(s => el("span", { className: "chip", textContent: s })),
  ]);
  return el("div", { className: "card" }, [
    el("a", { className: "title", href: REPO + p.path, textContent: p.titre }),
    el("p", { textContent: p.description }),
    meta,
  ]);
}

function render() {
  const query = q.value.trim();
  list.replaceChildren();

  if (query) {
    // Search: one flat list, best match first.
    const ranked = search(projects, query);
    count.textContent = `${ranked.length} projet${ranked.length > 1 ? "s" : ""}`;
    if (!ranked.length) list.append(el("p", { className: "empty", textContent: "Aucun projet ne correspond." }));
    for (const p of ranked) list.append(card(p, true));
    return;
  }

  // No search: everything, grouped by theme then subject.
  count.textContent = `${projects.length} projet${projects.length > 1 ? "s" : ""}`;
  if (!projects.length) list.append(el("p", { className: "empty", textContent: "Aucun projet indexé pour l'instant." }));
  let theme, sujet;
  for (const p of projects) {
    if (p.theme !== theme) { theme = p.theme; sujet = null; list.append(el("h2", { textContent: theme })); }
    if (p.sujet !== sujet) { sujet = p.sujet; list.append(el("h3", { textContent: sujet })); }
    list.append(card(p, false));
  }
}

fetch("projects.json")
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    projects = data;
    render();
  })
  .catch(() => {
    count.textContent = "";
    list.replaceChildren(el("p", { className: "empty", textContent: "L'index des projets n'a pas pu être chargé." }));
  });
q.addEventListener("input", render);
</script>
</body>
</html>
